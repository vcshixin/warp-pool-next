name: 源码与镜像验证
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 自动化测试
        run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: warp-pool-next:ci
          cache-from: type=gha,scope=ci-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ runner.arch }}
      - name: 成品镜像启动检查
        run: |
          docker run --rm warp-pool-next:ci --version
          docker run --rm --entrypoint python3 warp-pool-next:ci -c 'import pwd; assert pwd.getpwnam("warpnext").pw_uid == 41001'
          docker compose -f deploy/compose.yaml config --quiet
